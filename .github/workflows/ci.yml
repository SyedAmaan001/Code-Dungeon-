name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, content, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway PostgreSQL for migration and database tests (no credentials: trust auth inside the job).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Real CPython for verifying curriculum examples (docs/CONTENT_QUALITY_STANDARD.md).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: npm ci
      - name: Apply migrations to a clean database (twice, to prove re-runs are no-ops)
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: npm run db:migrate && npm run db:migrate && npm run db:status
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - name: Verify Python examples (curriculum + fixtures) with a real interpreter
        run: npm run content:verify-python -- content tests/fixtures/packs
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
