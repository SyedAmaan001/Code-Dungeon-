name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, content, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Real CPython for verifying curriculum examples (docs/CONTENT_QUALITY_STANDARD.md).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - name: Verify Python examples (curriculum + fixtures) with a real interpreter
        run: npm run content:verify-python -- content tests/fixtures/packs
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
